version: '3.8'

services:
  db:
    image: postgres:latest
    platform: linux/x86_64
    container_name: chiper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chiper
      POSTGRES_PASSWORD: chiper@123
      POSTGRES_DB: chiper
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - postgres_network
  mailtrap:
    image: mailhog/mailhog:latest
    platform: linux/x86_64
    container_name: chiper-mailtrap
    restart: unless-stopped
    ports:
      - 1025:1025
      - 8025:8025

volumes:
  postgres_data:

networks:
  postgres_network:
